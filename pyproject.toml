[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "labkit"
version = "0.8.0"
description = "Small shared pieces for Gustavo's homelab projects: WhatsApp via WAHA, the local LLM broker, Pi deploys, project scaffolding, agent skills, Reddit RSS reader, readable web page text, scraping through a residential proxy."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = ["httpx>=0.27", "certifi>=2026.10.19"]

[project.optional-dependencies]
web = ["trafilatura>=2.0"]
scrape = ["playwright>=1.55"]
stealth = ["patchright>=1.55"]
mcp = ["mcp>=2.2,<3", "trafilatura>=2.0"]
test = ["pytest>=8", "pyyaml>=6", "trafilatura>=2.0", "mcp>=2.2,<3"]

[project.scripts]
labkit = "labkit.cli:main"
labkit-reddit-mcp = "labkit.reddit_mcp:main"

[tool.setuptools]
packages = ["labkit"]

[tool.setuptools.package-data]
labkit = ["skills/*/SKILL.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
