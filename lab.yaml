# What this repo is to the rest of the lab. Read by labwatch's catalog (agents
# query it through the `lab` MCP). This repo is PUBLIC: no addresses, ports,
# hosts or secrets here; refer to services by id.
product: labkit
summary: "Shared Python package for the lab's projects: WhatsApp via WAHA, the local LLM broker client, Pi deploys, project scaffolding and agent skills. Use it instead of copying code between repos."
repo: GustavoPintoDeAbreu/labkit
provides:
  - {id: labkit.waha, kind: lib, path: labkit/waha.py, summary: "Send WhatsApp text and voice notes (OGG/Opus) through WAHA: Notifier interface, MockNotifier twin, WahaNotifier with retry on 5xx/connection errors and fail-fast on 4xx"}
  - {id: labkit.broker, kind: lib, path: labkit/broker.py, summary: "Local LLM client for the GPU broker: LLM.for_model(name).chat(system, user), running(), unload(model); strips <think>, thinking off by default"}
  - {id: labkit.deploy_pi, kind: cli, path: labkit/deploy_pi.py, summary: "labkit deploy-pi: ship a repo's deploy/pi compose project to the Raspberry Pi (clean-tree guard, version stamp, rsync, --init-env, build and restart)"}
  - {id: labkit.init, kind: cli, path: labkit/scaffold.py, summary: "labkit init: add AGENTS.md (with the Lab block), CLAUDE.md -> @AGENTS.md and a lab.yaml skeleton to a new project"}
  - {id: labkit.skills, kind: skill, path: labkit/skills, summary: "Agent skills send-whatsapp, use-llm-broker, deploy-to-pi, new-lab-project; labkit install-skills puts them in ~/.claude/skills"}
uses: [svc.kaya-waha, svc.llm-broker, host.pi]
docs:
  - {topic: "agent guide (start here)", path: AGENTS.md}
  - {topic: "README: install and release", path: README.md}
