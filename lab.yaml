# What this repo is to the rest of the lab. Read by labwatch's catalog (agents
# query it through the `lab` MCP). This repo is PUBLIC: no addresses, ports,
# hosts or secrets here; refer to services by id.
product: labkit
summary: "Shared Python package for the lab's projects: WhatsApp via WAHA, the local LLM broker client, Pi deploys, project scaffolding and agent skills, a Reddit reader (his Chrome, then RSS), web page text, residential-proxy scraping and a YouTube reader. Use it instead of copying code between repos."
repo: GustavoPintoDeAbreu/labkit
provides:
  - {id: labkit.waha, kind: lib, path: labkit/waha.py, summary: "Send WhatsApp text and voice notes (OGG/Opus) through WAHA: Notifier interface, MockNotifier twin, WahaNotifier with retry on 5xx/connection errors and fail-fast on 4xx"}
  - {id: labkit.broker, kind: lib, path: labkit/broker.py, summary: "Local LLM client for the GPU broker: LLM.for_model(name).chat(system, user), complete_tools(messages, tools) for OpenAI tool calls (the whole message, tool_calls included), running(), unload(model), FollowLoaded(default, follow) to use a capable model already loaded instead of forcing a swap; strips <think>, thinking off by default"}
  - {id: labkit.gpu_claims, kind: lib, path: labkit/gpu_claims.py, summary: "GPU claims: claim(owner, gpus, reason, ttl_s, since) while a project uses a card outside the broker's queue (redditcast's TTS), release() when done, claims(gpus) for a project deciding whether to start long GPU work (idea-pipeline). One JSON file per owner in ~/.local/state/lab/gpu-claims; since may lie ahead (a booking); until caps a dead owner's claim; nothing is evicted"}
  - {id: labkit.deploy_pi, kind: cli, path: labkit/deploy_pi.py, summary: "labkit deploy-pi: ship a repo's deploy/pi compose project to the Raspberry Pi (clean-tree guard, version stamp, rsync, --init-env, build and restart)"}
  - {id: labkit.init, kind: cli, path: labkit/scaffold.py, summary: "labkit init: add AGENTS.md (with the Lab block), CLAUDE.md -> @AGENTS.md and a lab.yaml skeleton to a new project"}
  - {id: labkit.skills, kind: skill, path: labkit/skills, summary: "Agent skills send-whatsapp, use-llm-broker, deploy-to-pi, new-lab-project; labkit install-skills puts them in ~/.claude/skills"}
  - {id: labkit.reddit, kind: lib, path: labkit/reddit.py, summary: "fetch_post(url) reads a post (www/old/m permalinks, redd.it, app /s/ share links) with its top comments and outbound links, through his logged-in Chrome first (lab-browser read_page, exact old.reddit parse, no model; on the PC with his desktop up) since Reddit refuses the lab's logged-out reads (2026-11-17), then the public RSS (honest User-Agent, 65 s pacing, stop on 403/429). parse_post_page / read_page_via_chrome for other callers; RedditRSS.top() for listings (RSS)"}
  - {id: labkit.web, kind: lib, path: labkit/web.py, summary: "fetch_page(url): readable text of a web page via trafilatura (labkit[web]), size cap, never raises, skips Reddit and media hosts, refuses private/LAN/Tailscale addresses (each redirect hop checked); GitHub repo links return the README"}
  - {id: cli.reddit-mcp, kind: cli, path: labkit/reddit_mcp.py, summary: "labkit-reddit-mcp (labkit[mcp]): stdio MCP server with read_reddit_post(url) for coding agents (Claude Code, claude-local, qcode): post, top comments, linked pages (GitHub READMEs), optional image; 65 s pacing shared across processes, 1 h cache, stops when Reddit refuses"}
  - {id: labkit.youtube, kind: lib, path: labkit/youtube.py, summary: "fetch_video(url, out_dir, screenshots=8): a YouTube video's (youtube.com, youtu.be, ?si= share links, shorts) title, channel, description, chapters and transcript (manual or auto captions via yt-dlp, labkit[youtube]) plus at most 10 timestamped JPEG screenshots chosen by chapter start, scene change, then even spacing; to_markdown() for prompts; python -m labkit.youtube URL --out DIR prints what it read"}
  - {id: labkit.media, kind: lib, path: labkit/media.py, summary: "read_media(url, transcribe=None): what a video or reel is about, no login (labkit[youtube]): Instagram, TikTok, X, Facebook, Vimeo and YouTube links; site, author, date, caption and what is said (YouTube captions, or a short clip's speech through the caller's transcribe(audio_path)); to_text() for prompts; age-restricted or private posts raise MediaUnreadable"}
  - {id: labkit.stt, kind: lib, path: labkit/stt.py, summary: "Speech to text on the CPU (faster-whisper large-v3-turbo, int8), labkit[stt]: Transcriber().transcribe(audio_bytes, mime, language, prompt) for voice notes, transcribe_clip(path) for reels (labkit.media's transcribe); decode_audio works on PyAV 19. Lifted from lab-assistant (2026-11-24), which uses it; the idea pipeline too"}
  - {id: labkit.vision, kind: lib, path: labkit/vision.py, summary: "Describe pictures with the local vision model (Qwen3-VL 8B, broker photoshop-vision, GPU0), labkit[vision]: describe([paths or bytes], question) -> text; data_url() = JPEG, long side <= 1024 (Local Photoshop's encoding). For projects whose model cannot see images (the idea pipeline's text-only planners, 2026-11-24)"}
  - {id: labkit.repovet, kind: lib, path: labkit/repovet.py, summary: "vet(url, ref=None): is this GitHub repository a fake project? Verdict ok/caution/red with reasons (fake commit activity, big claims over little code, base64-hidden links, download hosts, antivirus/SmartScreen bypass instructions, look-alikes), read through the GitHub API only; scan_tree(path) for a clone on disk; repo_refs(text)/is_pinned(ref) for requirements files and scripts. CLI: labkit vet <url>"}
  - {id: labkit.scrape, kind: lib, path: labkit/scrape.py, summary: "Scraping through the Evomi residential proxy (never the home IP): ProxyFetcher (httpx) and BrowserFetcher (headed Chromium on Xvfb, labkit[scrape], optional image/font blocking and host allow-list; engine=patchright via labkit[stealth] passes Idealista's Cloudflare; screenshot() returns a PNG of the settled page), paced, counting proxy bytes for a daily cap; RawLog gzipped page log; SourceUnavailable/SourceDrift. Lifted from price-scout"}
  - {id: labkit.access, kind: lib, path: labkit/access.py, summary: "AccessGuard ASGI middleware (labkit[access]): the second lock behind Cloudflare Access. A request with Cloudflare headers or from a non-private address needs a valid Access token (RS256 against the team keys, the app AUD tag, the team issuer); the LAN, tailnet and host pass as before; unset CF_ACCESS_TEAM_DOMAIN/CF_ACCESS_AUD fails closed; request.state.access_email"}
uses: [svc.kaya-waha, svc.llm-broker, host.pi]
docs:
  - {topic: "agent guide (start here)", path: AGENTS.md}
  - {topic: "README: install and release", path: README.md}
  - {topic: "scraping playbook: the ladder, what worked on which site (KuantoKusta, Idealista, TAP, easyJet, OLX), checking a page is real", path: docs/scraping-playbook.md}
